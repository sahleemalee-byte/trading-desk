name: daily-brief

on:
  schedule:
    - cron: "0 12 * * 1-4"
  workflow_dispatch: {}

jobs:
  brief:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the daily brief
        working-directory: trading-desk
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python -m trading_desk.brief
      - name: Save the ledger
        run: |
          git config user.name "trading-desk-bot"
          git config user.email "bot@users.noreply.github.com"
          git add trading-desk/ledger.json || true
          git commit -m "update ledger" || echo "nothing changed"
          git push || echo "nothing to push"
