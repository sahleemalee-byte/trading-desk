name: daily-brief

on:
  schedule:
    - cron: "0 12 * * 1-4"
  workflow_dispatch: {}

jobs:
  desk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the desk and publish results
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          PYTHONPATH: trading-desk
        run: python -m trading_desk.publish

      - name: Notify (optional - set NTFY_TOPIC secret to enable)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -n "$NTFY_TOPIC" ]; then
            curl -s -H "Title: Trading desk updated" -d "Your desk ran - open it to see today's read." "https://ntfy.sh/$NTFY_TOPIC" || true
          else
            echo "No NTFY_TOPIC set - skipping notification."
          fi

      - name: Save results + ledger
        run: |
          git config user.name "trading-desk-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/state.json ledger.json || true
          git commit -m "update desk" || echo "nothing changed"
          git push || echo "nothing to push"
